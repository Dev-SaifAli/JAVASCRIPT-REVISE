<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold">My Day</h1>
                <p id="date" class="text-muted"></p>
            </div>
            <div class="actions">
                <button id="undoBtn" class="btn btn-outline-secondary btn-sm" disabled>Undo Delete</button>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#todoModal">
                    <i class="fa-solid fa-plus"></i> Add Task
                </button>
            </div>
        </header>

        <div class="search-bar mb-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Search tasks or notes...">
        </div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Done</th>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Notes</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Priority</th>
                        <th>Category</th>
                        <th>Due</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="task-list">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="todoModal" tabindex="-1">
        <div class="modal-dialog">
            <form id="todoForm" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Priority</label>
                            <select name="priority" class="form-select">
                                <option value="low">Low</option>
                                <option value="normal" selected>Normal</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" name="category" class="form-control" placeholder="e.g. Work">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="date" name="dueDate" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary addBtn">Add Task</button>
                </div>
            </form>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
