<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Web Application</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=radio_button_unchecked" />


</head>

<body>
    <!-- <div class="container">
        <h2>To-do list</h2>
        <input type="text" id="taskInput" placeholder="Add a new task..." autofocus>
        <button type="button" id="addTaskBtn">Add Task</button>
        <ul id="task-list"></ul>
        
    </div> -->

    <div class="todo">
        <header class="header">
            <h1>My Day</h1>
            <p id="date"></p>
        </header>
        <main>


            <button type="button" class="addBtn  " data-bs-toggle="modal" data-bs-target="#todoModal">Add
                Task</button>

            <!-- <div class="user-input">
                <span class="material-symbols-outlined">
                    radio_button_unchecked
                </span>
                <input type="text" class="input" id="title" placeholder="Add a task today" required autofocus>

            </div> -->

            <table class="table table-striped table-dark table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Task</th>
                        <th>Description</th>
                        <th>Completed</th>
                        <th>Creation date</th>
                        <th>Priority</th>
                        <th>Category</th>
                        <th>Due date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="task-list">
                    <tr id="defaultText">
                        <td colspan="9">

                            <div class="defaultText">
                                <i class="fa-solid fa-calendar " style="color: #ffd500;"></i>
                                <div class="content">
                                    <h4>Focus on your day</h4>
                                    <p>Get things done with My Day, a list <br> that refreshes every day</p>
                                </div>
                            </div>
                            
                        </td>
                    </tr>
                </tbody>


            </table>

            <!-- Modal -->
            <div class="modal fade" id="todoModal" tabindex="-1" aria-labelledby="form" aria-hidden="true">
                <div class="modal-dialog">
                    <form action="" id="todoForm">


                        <div class="modal-content">
                            <!-- <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Add Task</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div> -->
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="title" class="form-label">Title <span
                                            class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="title" placeholder="Morning Walk"
                                        required>
                                </div>
                                <div class="mb-3">
                                    <label for="priority" class="form-label">Priority</label>
                                    <select class="form-select" aria-label="select priority" id="priority">
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option selected value="high">High</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="category" class="form-label">Category</label>
                                    <select class="form-select" aria-label="select category" id="category">
                                        <option selected value="personal">Personal</option>
                                        <option value="work">Work</option>
                                        <option value="study">Study</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="dueDate" class="form-label">Due date</label>
                                    <input type="date" class="form-control" id="dueDate" value="">
                                </div>
                                <div class="mb-3">
                                    <label for="notes" class="form-label">Notes</label>
                                    <textarea class="form-control" id="notes" rows="3"></textarea>
                                </div>


                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary" id="addTaskBtn">Save changes</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>





    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
